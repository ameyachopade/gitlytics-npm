name: Packaging

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    name: Tarball & TypeScript Declaration Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify package manifest and types
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!fs.existsSync(pkg.main)) throw new Error("Missing main entry");
            if (!fs.existsSync(pkg.types)) throw new Error("Missing types entry");
            if (!fs.existsSync(pkg.bin.gitlytics)) throw new Error("Missing bin entry");
          '

      - name: Dry-run npm pack
        run: npm pack --dry-run
